name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sources
        if: hashFiles('youcode-src.tar.gz.b64') != ''
        run: |
          base64 -d youcode-src.tar.gz.b64 > src.tar.gz
          gzip -t src.tar.gz
          tar xzf src.tar.gz
          rm -f src.tar.gz
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Gradle 8.9
        run: |
          curl -sSLo gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip

      - name: Build debug APK
        run: ./gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouCode-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
