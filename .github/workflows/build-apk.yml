name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose archive
        run: |
          set +e
          {
            echo "== ls =="
            ls -la
            echo "== decode =="
            base64 -d youcode-src.tar.gz.b64 > src.tar.gz
            echo "b64 rc=$?"
            ls -l src.tar.gz
            echo "== gzip test =="
            gzip -t src.tar.gz
            echo "gzip rc=$?"
            echo "== tar list =="
            tar tzf src.tar.gz | head -n 30
            echo "tar rc=$?"
            echo "== head bytes =="
            head -c 32 src.tar.gz | od -An -tx1
            echo "== sha256 =="
            sha256sum src.tar.gz
          } > diag.txt 2>&1
          cat diag.txt
          git config user.name "diag-bot"
          git config user.email "diag@example.com"
          git add diag.txt
          git commit -m "diag" || true
          git push || true
