name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      src_url:
        description: 'URL with base64 source zip'
        required: true
        default: 'https://termbin.com/mh1p'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Download sources
        run: |
          set -e
          curl -fsSL --retry 6 --retry-delay 3 --retry-all-errors "\${SRC_URL}" -o src.b64
          base64 -d src.b64 > src.zip
          unzip -oq src.zip -d . -x "app/src/main/java/com/opencode/ai/viewmodel/ChatViewModel.kt"
          ls app/src/main
        env:
          SRC_URL: \${{ inputs.src_url || 'https://termbin.com/mh1p' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          set -x
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -sSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdt
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv /tmp/cmdt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Get Gradle 8.9
        run: |
          curl -sSLo gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip

      - name: Build debug APK
        run: |
          set +e
          ./gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          echo "gradle_rc=$?" >> build.log
          tail -n 200 build.log

      - name: Publish build log
        if: always()
        continue-on-error: true
        run: |
          git config user.name "log-bot"
          git config user.email "log@example.com"
          git add build.log || true
          git commit -m "build log" || true
          git push || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouCode-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-\${{ github.run_number }}
          name: YouCode build \${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
