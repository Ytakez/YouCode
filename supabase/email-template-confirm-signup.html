<!-- Supabase → Authentication → Emails → "Confirm sign up".
     Subject: Код подтверждения YouCode
     Вставьте этот HTML в поле Message body. {{ .Token }} — код из письма, который вводится в приложении. -->
<div style="font-family:Arial,sans-serif;max-width:420px;margin:0 auto;padding:24px">
  <h2 style="margin:0 0 12px">Подтвердите почту</h2>
  <p style="margin:0 0 16px;color:#444">Введите этот код в приложении YouCode:</p>
  <p style="font-size:34px;font-weight:700;letter-spacing:8px;margin:0 0 16px">{{ .Token }}</p>
  <p style="margin:0;color:#777;font-size:13px">Код действует 1 час. Если вы не регистрировались в YouCode — просто проигнорируйте письмо.</p>
</div>
